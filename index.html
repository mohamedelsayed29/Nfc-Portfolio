<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<title>Mohamed Elsayed — Developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090c;
    --panel: #0d1117;
    --panel-2: #121821;
    --line: #1f2a37;
    --text: #c9d4e0;
    --dim: #5c6b7c;
    --green: #3ddc84;
    --cyan: #4fd1ff;
    --amber: #ffb547;
    --pink: #ff5f87;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* background grid + glow */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(600px 400px at 50% 0%, rgba(61,220,132,.10), transparent 70%),
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 32px 32px;
    opacity: .35;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
    pointer-events: none;
    animation: drift 20s linear infinite;
  }
  @keyframes drift { to { background-position: 0 0, 0 32px, 32px 0; } }

  /* terminal window */
  .term {
    position: relative;
    width: 100%;
    max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 0 0 1px rgba(61,220,132,.06), 0 30px 80px -20px rgba(0,0,0,.8), 0 0 60px -20px rgba(61,220,132,.25);
    overflow: hidden;
    animation: rise .6s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.98); } }
  /* scanlines */
  .term::after {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  .bar {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--line);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot:nth-child(1) { background: #ff5f57; }
  .dot:nth-child(2) { background: #febc2e; }
  .dot:nth-child(3) { background: #28c840; }
  .bar .title { flex: 1; text-align: center; color: var(--dim); font-size: 12px; margin-right: 44px; }

  .screen { padding: 18px 18px 22px; min-height: 520px; }
  .ln { white-space: pre-wrap; word-break: break-word; }
  .ps { color: var(--green); }
  .ps .path { color: var(--cyan); }
  .out { color: var(--dim); }
  .ok { color: var(--green); }
  .hl { color: var(--amber); }
  .cursor {
    display: inline-block; width: 8px; height: 1.1em;
    background: var(--green); vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .block { margin: 10px 0 16px; }
  .reveal { animation: fadeUp .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } }

  /* profile */
  .profile { display: flex; gap: 16px; align-items: center; }
  .avatar {
    position: relative; flex: none;
    width: 84px; height: 84px; border-radius: 10px;
    border: 1px solid var(--green);
    overflow: hidden;
    background: var(--panel-2);
    box-shadow: 0 0 24px -6px rgba(61,220,132,.6);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(.2) contrast(1.05); }
  .avatar .initials {
    width: 100%; height: 100%; display: grid; place-items: center;
    font-size: 28px; font-weight: 700; color: var(--green);
  }
  .avatar::after {
    content: ""; position: absolute; left: 0; right: 0; height: 30%;
    background: linear-gradient(transparent, rgba(61,220,132,.35), transparent);
    animation: scan 2.8s ease-in-out infinite;
  }
  @keyframes scan { 0% { top: -30%; } 100% { top: 100%; } }
  .name { font-size: 20px; font-weight: 700; color: #fff; line-height: 1.25; }
  .name.glitch { position: relative; }
  .name.glitch::before, .name.glitch::after {
    content: attr(data-text); position: absolute; inset: 0; opacity: 0;
  }
  .name.glitch::before { color: var(--pink); animation: g1 4s infinite; }
  .name.glitch::after  { color: var(--cyan); animation: g2 4s infinite; }
  @keyframes g1 { 0%,92%,100% { opacity: 0; } 93% { opacity: .8; transform: translate(-2px, 1px); } 95% { opacity: .8; transform: translate(2px, -1px); } }
  @keyframes g2 { 0%,92%,100% { opacity: 0; } 94% { opacity: .8; transform: translate(2px, 1px); } 96% { opacity: .8; transform: translate(-2px, 0); } }
  .role { color: var(--green); font-size: 13px; }
  .bio { color: var(--dim); font-size: 12px; margin-top: 2px; }

  /* json-ish stack */
  .kv { font-size: 13px; }
  .kv .k { color: var(--cyan); }
  .kv .s { color: var(--amber); }
  .kv .p { color: var(--dim); }

  /* links */
  .links { display: grid; gap: 10px; }
  .link {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel-2);
    color: var(--text);
    text-decoration: none;
    overflow: hidden;
    transition: border-color .2s, transform .2s, background .2s;
  }
  .link::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(61,220,132,.12), transparent);
    transform: translateX(-100%);
    transition: transform .6s;
  }
  .link:hover, .link:focus-visible { border-color: var(--green); transform: translateX(4px); outline: none; }
  .link:hover::before { transform: translateX(100%); }
  .link:active { transform: scale(.98); }
  .link svg { width: 22px; height: 22px; flex: none; }
  .link .meta { flex: 1; min-width: 0; }
  .link .label { font-weight: 700; color: #fff; font-size: 14px; }
  .link .sub { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link .arrow { color: var(--dim); transition: color .2s, transform .2s; }
  .link:hover .arrow { color: var(--green); transform: translateX(3px); }

  .link.primary {
    border-color: rgba(255,181,71,.5);
    background: linear-gradient(135deg, rgba(255,181,71,.12), var(--panel-2) 60%);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .link.primary .label { color: var(--amber); }
  .link.primary:hover { border-color: var(--amber); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,181,71,0); } 50% { box-shadow: 0 0 22px -4px rgba(255,181,71,.45); } }

  .copy {
    flex: none;
    font: inherit; font-size: 11px;
    color: var(--amber);
    background: transparent;
    border: 1px dashed rgba(255,181,71,.5);
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
    position: relative; z-index: 1;
  }
  .copy:hover { background: rgba(255,181,71,.1); }

  .foot { margin-top: 16px; color: var(--dim); font-size: 11px; display: flex; justify-content: space-between; }

  .toast {
    position: fixed; left: 50%; bottom: 24px;
    transform: translate(-50%, 20px);
    background: var(--panel-2); color: var(--green);
    border: 1px solid var(--green); border-radius: 8px;
    padding: 8px 14px; font-size: 12px;
    opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

const $screen = document.getElementById("screen");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const short = url => url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");

document.getElementById("title").textContent = `${CONFIG.user}@dev: ~`;
document.title = `${CONFIG.name} — ${CONFIG.role}`;

function add(html, cls = "ln") {
  const el = document.createElement("div");
  el.className = cls;
  el.innerHTML = html;
  $screen.appendChild(el);
  return el;
}

const prompt = () => `<span class="ps">${esc(CONFIG.user)}@dev<span class="out">:</span><span class="path">~</span><span class="out">$</span></span> `;

async function type(cmd) {
  const el = add(prompt() + '<span class="cmd"></span><span class="cursor"></span>');
  const out = el.querySelector(".cmd");
  for (const ch of cmd) { out.textContent += ch; await wait(35 + Math.random() * 45); }
  await wait(180);
  el.querySelector(".cursor").remove();
}

async function progress() {
  const el = add('<span class="out">loading profile </span><span class="bar-txt"></span>');
  const t = el.querySelector(".bar-txt");
  for (let i = 0; i <= 20; i++) {
    t.innerHTML = `<span class="ok">${"█".repeat(i)}</span><span class="out">${"░".repeat(20 - i)}</span> ${i * 5}%`;
    await wait(22);
  }
}

function profileHTML() {
  const initials = CONFIG.name.split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
  const img = CONFIG.photo
    ? `<img src="${esc(CONFIG.photo)}" alt="${esc(CONFIG.name)}">`
    : `<div class="initials">${esc(initials)}</div>`;
  return `
    <div class="profile">
      <div class="avatar">${img}</div>
      <div>
        <div class="name glitch" data-text="${esc(CONFIG.name)}">${esc(CONFIG.name)}</div>
        <div class="role">&gt; ${esc(CONFIG.role)}</div>
        <div class="bio">// ${esc(CONFIG.bio)}</div>
      </div>
    </div>`;
}

function stackHTML() {
  const arr = CONFIG.stack.map(s => `<span class="s">"${esc(s)}"</span>`).join('<span class="p">, </span>');
  return `<div class="kv">
<span class="p">{</span>
  <span class="k">"stack"</span><span class="p">: [</span>${arr}<span class="p">],</span>
  <span class="k">"location"</span><span class="p">:</span> <span class="s">"${esc(CONFIG.location)}"</span><span class="p">,</span>
  <span class="k">"status"</span><span class="p">:</span> <span class="ok">"open_to_work"</span>
<span class="p">}</span></div>`;
}

function linksHTML() {
  const { instapay, phone, github, linkedin } = CONFIG;
  return `
    <div class="links">
      <a class="link primary reveal" href="${esc(instapay.url)}" target="_blank" rel="noopener">
        ${ICONS.instapay}
        <div class="meta"><div class="label">./pay --instapay</div><div class="sub">${esc(instapay.handle)}</div></div>
        <button class="copy" data-copy="${esc(instapay.handle)}" aria-label="Copy InstaPay address">copy</button>
      </a>
      <a class="link reveal" style="animation-delay:.08s" href="tel:${esc(phone)}">
        ${ICONS.phone}
        <div class="meta"><div class="label">call</div><div class="sub">${esc(phone)}</div></div>
        <button class="copy" data-copy="${esc(phone)}" aria-label="Copy phone number">copy</button>
      </a>
      <a class="link reveal" style="animation-delay:.16s" href="${esc(github)}" target="_blank" rel="noopener">
        ${ICONS.github}
        <div class="meta"><div class="label">github</div><div class="sub">${esc(short(github))}</div></div>
        <span class="arrow">→</span>
      </a>
      <a class="link reveal" style="animation-delay:.24s" href="${esc(linkedin)}" target="_blank" rel="noopener">
        ${ICONS.linkedin}
        <div class="meta"><div class="label">linkedin</div><div class="sub">${esc(short(linkedin))}</div></div>
        <span class="arrow">→</span>
      </a>
    </div>`;
}

async function boot() {
  await wait(400);
  await type(`ssh guest@${CONFIG.user}.dev`);
  add('<span class="out">connecting...</span> <span class="ok">[ OK ]</span>');
  await wait(150);
  await progress();
  await wait(200);

  await type("whoami");
  add(profileHTML(), "block reveal");
  await wait(350);

  await type("cat about.json");
  add(stackHTML(), "block reveal");
  await wait(350);

  await type("ls ./links");
  add(linksHTML(), "block");
  await wait(500);

  add(prompt() + '<span class="cursor"></span>');
  add(`<span>tap a link to connect</span><span>© ${new Date().getFullYear()}</span>`, "foot reveal");
}

/* copy InstaPay handle without opening the link */
const toast = document.getElementById("toast");
$screen.addEventListener("click", async e => {
  const btn = e.target.closest(".copy");
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();
  try { await navigator.clipboard.writeText(btn.dataset.copy); }
  catch {
    const ta = Object.assign(document.createElement("textarea"), { value: btn.dataset.copy });
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  btn.textContent = "copied";
  toast.classList.add("show");
  setTimeout(() => { toast.classList.remove("show"); btn.textContent = "copy"; }, 1600);
});

boot();
</script>
